[project]
name = "RepitteGlobal"
workspace = "."
state_dir = ".document-kit"
cache_dir = ".document-kit/cache"

[automation]
# Automatic documentation update happens only after a successful document-kit pull
# from one of these branches and only when HEAD changed. Failed runs can be retried
# explicitly with `document-kit retry` without requiring another source change.
auto_update = true
require_current_branch_match = true
require_clean_worktree = true
allowed_branches = ["develop", "dev", "staging", "stg", "production", "prod"]

[cbm]
enabled = true
command = "codebase-memory-mcp"
depth = 5

[cursor]
command = "agent"
model = ""
timeout_seconds = 1800

[outputs]
spec_json = "docs/spec.json"
markdown = "docs/SPEC.md"
html = "docs/index.html"
# Optional: set this only when an Excel export is actually needed.
xlsx = ""
changelog = "docs/CHANGELOG.md"

[[repositories]]
name = "RepitteGlobal-AdminPortal"
path = "RepitteGlobal-AdminPortal"
cbm_project = "RepitteGlobal-AdminPortal"

[[repositories]]
name = "RepitteGlobal-BookingService"
path = "RepitteGlobal-BookingService"
cbm_project = "RepitteGlobal-BookingService"

# Repositories may also live outside the workspace.
[[repositories]]
name = "RepitteGlobal-ManagementService"
path = "/absolute/path/to/RepitteGlobal-ManagementService"
cbm_project = "RepitteGlobal-ManagementService"
